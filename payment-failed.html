<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Payment Unsuccessful | Trio</title>

  <link rel="stylesheet" href="payment-result.css">

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >
</head>

<body>

  <main class="result-page">

    <section class="result-card failed">

      <img
        src="trio-logo.png"
        alt="Trio Logo"
        class="result-logo"
      >

      <div class="result-icon">
        <i class="fa-solid fa-xmark"></i>
      </div>

      <span class="result-label">
        Payment unsuccessful
      </span>

      <h1>Your payment was not completed</h1>

      <p>
        The payment could not be verified. Your cart has
        not been deleted, so you can try again.
      </p>

      <div class="result-information">
        <i class="fa-solid fa-circle-info"></i>

        <span>
          Check your card information or try another payment
          method.
        </span>
      </div>

      <div class="result-actions">

        <a href="cart.html" class="primary-link">
          Try Again
        </a>

        <a href="purchase.html" class="secondary-link">
          Return to Product
        </a>

      </div>

    </section>

  </main>

</body>
</html>
